names:
  image: markhedleyjones-github-io
  workspace: docs
  user: user

stages:
  base:
    from: debian:bookworm-slim
    steps:
      - env:
          GEM_HOME: ${USER_HOME}/gems
          PATH: ${USER_HOME}/gems/bin:$PATH
      - apt-get:
          install:
            - build-essential
            - ruby-full
            - zlib1g-dev
      - create: user
      - become: user
      - gem install jekyll bundler
      - copy: docs/Gemfile docs/Gemfile.lock /tmp/
      - cd /tmp && bundle install

  development:
    from: base

  production:
    from: base
    steps:
      - copy: workspace

commands:
  serve:
    command: cd ${WORKSPACE} && bundle exec jekyll serve --host 0.0.0.0 --port 4111 --livereload --livereload-port 4112
    description: Start Jekyll dev server with live reload
    ports:
      - "4111:4111"
      - "4112:4112"
