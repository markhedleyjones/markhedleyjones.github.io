name: Build and deploy
# Pages publishes only the artifact produced by a successful build and link check.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: docs
      - name: Build site
        run: bundle exec jekyll build --safe --strict_front_matter
        working-directory: docs
        env:
          JEKYLL_ENV: production
      - name: Check for broken internal links
        run: |
          python3 - <<'PY'
          import re, sys
          from pathlib import Path

          site = Path("docs/_site")
          pages = sorted(site.rglob("*.html"))
          # Anything the build emitted is fetchable, plus directory indexes.
          available = {f"/{p.relative_to(site).as_posix()}" for p in site.rglob("*") if p.is_file()}
          available |= {f"/{p.parent.relative_to(site).as_posix()}/".replace("//", "/")
                        for p in site.rglob("index.html")}

          # Sibling project repos publish their own Pages sites under this
          # domain, so their paths are live but absent from this build.
          external_prefixes = (
              "/container-magic/",
              "/cartographer-slam-trajectory-editor/",
          )

          href = re.compile(r'(?:href|src)="(/[^"#?]*)')
          srcset = re.compile(r'\bsrcset="([^"]*)"')
          broken = []
          for page in pages:
              html = page.read_text(encoding="utf-8", errors="replace")
              targets = set(href.findall(html))
              for candidates in srcset.findall(html):
                  targets.update(candidate.strip().split()[0] for candidate in candidates.split(","))
              for target in targets:
                  target = target.split("?", 1)[0].split("#", 1)[0]
                  if not target.startswith("/") or target.startswith("//"):
                      continue
                  if target.startswith(external_prefixes):
                      continue
                  candidates = {target, target.rstrip("/") + "/", target + ".html",
                                target.rstrip("/") + "/index.html"}
                  if not candidates & available:
                      broken.append((page.relative_to(site).as_posix(), target))

          for page, target in sorted(set(broken)):
              print(f"{page}: {target}")
          print(f"\n{len(pages)} pages checked, {len(set(broken))} broken internal links")
          sys.exit(1 if broken else 0)
          PY
      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload verified site
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/_site
  deploy:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Deploy verified site
        id: deployment
        uses: actions/deploy-pages@v4
