<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">

  {%- include head.html -%}

  <body>

    <a class="skip-link" href="#main">Skip to content</a>

    {%- include header.html -%}

    <main id="main" class="page-content" tabindex="-1" aria-label="Content">
      {%- unless page.url == "/" -%}
      <div class="breadcrumbs-bar">
        {%- include breadcrumbs.html -%}
      </div>
      {%- endunless -%}
      {{ content }}
    </main>

    {%- include footer.html -%}

  </body>

</html>
