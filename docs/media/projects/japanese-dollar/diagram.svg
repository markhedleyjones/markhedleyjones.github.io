<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title description">
  <title id="title">The Japanese Dollar price-reading rule</title>
  <desc id="description">1,200 yen divided by 100 reads as 12 JPD.</desc>
  <rect width="800" height="500" rx="24" fill="#111319"/>
  <circle cx="650" cy="114" r="77" fill="#e9b949" opacity=".16"/>
  <circle cx="650" cy="114" r="55" fill="#e9b949" stroke="#b8862f" stroke-width="5"/>
  <text x="650" y="129" text-anchor="middle" fill="#3e2b0e" font-family="sans-serif" font-size="35" font-weight="700">100</text>
  <text x="70" y="98" fill="#5ee3a1" font-family="sans-serif" font-size="23">THE JAPANESE DOLLAR</text>
  <text x="70" y="242" fill="#eef1f6" font-family="sans-serif" font-size="91" font-weight="700">¥1,200</text>
  <text x="72" y="312" fill="#b3bccb" font-family="sans-serif" font-size="30">yen ÷ 100</text>
  <path d="M455 270h84m-18-18 18 18-18 18" fill="none" stroke="#5ee3a1" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="70" y="425" fill="#5ee3a1" font-family="sans-serif" font-size="65" font-weight="700">12 JPD</text>
  <text x="486" y="425" fill="#b3bccb" font-family="sans-serif" font-size="20">a reading, not a currency</text>
</svg>
