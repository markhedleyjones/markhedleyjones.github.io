<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">Japanese Dollar price-reading rule</title>
  <desc id="description">1,200 yen divided by 100 reads as $12 JPD.</desc>
  <rect width="800" height="600" fill="#e5ebef"/>
  <g font-family="sans-serif" text-anchor="middle" fill="#263b4a">
    <text x="400" y="205" font-size="94">¥1,200</text>
    <path d="M400 260v82m-18-18 18 18 18-18" fill="none" stroke="#607a8b" stroke-width="5"/>
    <text x="495" y="311" font-size="32" fill="#526c7c">÷ 100</text>
    <text x="400" y="455" font-size="86">$12 JPD</text>
  </g>
</svg>
