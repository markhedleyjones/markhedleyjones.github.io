<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <!-- Rear wheels (fixed for both states) -->
  <rect x="93" y="252" width="14" height="30" rx="3" fill="#555"/>
  <rect x="193" y="252" width="14" height="30" rx="3" fill="#555"/>

  <!-- STATE 1: Normal right turn — TC at (450, 267) -->
  <g transform="translate(100,104) rotate(25.0)">
    <rect x="-7" y="-15" width="14" height="30" rx="3" fill="#d63031" opacity="0.35"/>
  </g>
  <g transform="translate(200,104) rotate(33.1)">
    <rect x="-7" y="-15" width="14" height="30" rx="3" fill="#d63031" opacity="0.35"/>
  </g>
  <line x1="200" y1="104" x2="450" y2="267" stroke="#d63031" stroke-width="1" stroke-dasharray="6,4" opacity="0.45"/>
  <line x1="100" y1="104" x2="450" y2="267" stroke="#d63031" stroke-width="1" stroke-dasharray="6,4" opacity="0.45"/>
  <line x1="207" y1="267" x2="450" y2="267" stroke="#d63031" stroke-width="1" stroke-dasharray="6,4" opacity="0.45"/>
  <circle cx="450" cy="267" r="5" fill="#d63031" opacity="0.7"/>

  <!-- STATE 2: Full lock — TC at rear axle midpoint (150, 267) -->
  <g transform="translate(100,104) rotate(72.9)">
    <rect x="-7" y="-15" width="14" height="30" rx="3" fill="#2980b9" opacity="0.35"/>
  </g>
  <g transform="translate(200,104) rotate(-72.9)">
    <rect x="-7" y="-15" width="14" height="30" rx="3" fill="#2980b9" opacity="0.35"/>
  </g>
  <line x1="100" y1="104" x2="150" y2="267" stroke="#2980b9" stroke-width="1" stroke-dasharray="6,4" opacity="0.45"/>
  <line x1="200" y1="104" x2="150" y2="267" stroke="#2980b9" stroke-width="1" stroke-dasharray="6,4" opacity="0.45"/>
  <!-- Rear axle lines from TC to each rear wheel -->
  <line x1="93" y1="267" x2="150" y2="267" stroke="#2980b9" stroke-width="1" stroke-dasharray="6,4" opacity="0.45"/>
  <line x1="150" y1="267" x2="207" y2="267" stroke="#2980b9" stroke-width="1" stroke-dasharray="6,4" opacity="0.45"/>
  <circle cx="150" cy="267" r="5" fill="#2980b9" opacity="0.7"/>

  <!-- Labels -->
  <text x="150" y="300" font-size="16" fill="#2980b9" font-family="sans-serif" text-anchor="middle">full lock</text>
  <text x="450" y="300" font-size="16" fill="#d63031" font-family="sans-serif" text-anchor="middle">normal turn</text>
</svg>
